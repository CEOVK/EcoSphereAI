<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSphere AI | Waste Registry</title>
    <style>
        :root {
            --bg: #06131d;
            --panel: rgba(15, 31, 40, 0.96);
            --text: #ebf7f1;
            --muted: #a8bcc8;
            --primary: #45d39a;
            --primary-2: #7ce6c3;
            --line: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #06131d 0%, #0b1c29 100%);
            color: var(--text);
        }
        .page { max-width: 1280px; margin: 0 auto; padding: 28px; }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(13, 27, 37, 0.95);
        }
        .brand { color: var(--primary-2); font-weight: 800; letter-spacing: 0.08em; }
        .nav { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); }
        .content { display: grid; grid-template-columns: 1.4fr 0.6fr; gap: 20px; margin-top: 24px; }
        .card {
            background: rgba(15, 31, 40, 0.96); border: 1px solid var(--line); border-radius: 20px; padding: 20px; box-shadow: 0 20px 30px rgba(0,0,0,0.18);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 8px; border-bottom: 1px solid var(--line); text-align: left; }
        th { color: var(--muted); }
        input, select, button {
            width: 100%; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.02); color: var(--text); padding: 12px 14px; margin-top: 8px; font-size: 1rem;
        }
        button { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #072410; font-weight: 800; border: none; cursor: pointer; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .status-pill {
            display: inline-block; background: rgba(69, 211, 154, 0.12); color: var(--primary); border-radius: 999px; padding: 6px 10px; font-size: 0.75rem; font-weight: 700;
        }
        @media (max-width: 900px) { .content { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="brand">ECOSPHERE AI</div>
        <div class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/waste">Waste</a>
            <a href="/projects">Projects</a>
            <a href="/leaders">Leaderboard</a>
            <a href="/esg">ESG</a>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <h2>Waste Registry</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Weight</th>
                        <th>Student</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="wasteRows"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Add Waste Entry</h2>
            <form id="wasteForm">
                <input name="itemType" placeholder="Item Type" value="Laptop Motherboard" />
                <div class="two-col">
                    <input name="category" placeholder="Category" value="Electronics" />
                    <input name="weight" type="number" step="0.1" placeholder="Weight (kg)" value="2.5" />
                </div>
                <div class="two-col">
                    <input name="studentName" placeholder="Student" value="Aarav Singh" />
                    <input name="className" placeholder="Class" value="10A" />
                </div>
                <input name="collectionPoint" placeholder="Collection Point" value="STEM Lab" />
                <select name="status">
                    <option>Received</option>
                    <option>Sorted</option>
                    <option>Repurposed</option>
                    <option>Recycled</option>
                </select>
                <button type="submit">Submit Waste Entry</button>
            </form>
        </div>
    </div>
</div>

<script>
    async function loadWaste() {
        const data = await fetch('/api/waste').then(r => r.json());
        document.getElementById('wasteRows').innerHTML = (data || []).slice(0, 10).map(item => `
            <tr>
                <td>${item.itemType || 'Unknown'}</td>
                <td>${item.weight || 0} kg</td>
                <td>${item.studentName || '-'}</td>
                <td><span class="status-pill">${item.status || 'Received'}</span></td>
            </tr>
        `).join('');
    }

    document.getElementById('wasteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const payload = {
            itemType: form.get('itemType'),
            category: form.get('category'),
            weight: Number(form.get('weight')),
            studentName: form.get('studentName'),
            className: form.get('className'),
            collectionPoint: form.get('collectionPoint'),
            status: form.get('status'),
            condition: 'Good',
            serialNumber: `SER-${Date.now()}`,
            qrId: `EW-${Date.now()}`,
            collectionDate: new Date().toISOString().split('T')[0]
        };
        await fetch('/api/waste', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        loadWaste();
        e.target.reset();
    });

    loadWaste();
</script>
</body>
</html>
