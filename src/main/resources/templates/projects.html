<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoSphere AI | Projects</title>
    <style>
        :root { --bg:#06131d; --panel:rgba(15,31,40,.96); --text:#ebf7f1; --muted:#a8bcc8; --primary:#45d39a; --line:rgba(255,255,255,.08);} *{box-sizing:border-box;} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#06131d,#0b1d29);color:var(--text);} .page{max-width:1280px;margin:0 auto;padding:28px;} .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:rgba(13,27,37,.95);} .brand{font-weight:800;letter-spacing:.08em;color:#7ce6c3;} .nav{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);} .content{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;margin-top:24px;} .card{background:rgba(15,31,40,.96);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 30px rgba(0,0,0,.18);} table{width:100%;border-collapse:collapse;} th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;} th{color:var(--muted);} input,select,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--text);margin-top:8px;} button{background:linear-gradient(135deg,var(--primary),#7ce6c3);color:#072410;font-weight:800;border:none;cursor:pointer;} .status-pill{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(69,211,154,.12);color:var(--primary);font-size:.74rem;font-weight:700;} @media(max-width:900px){.content{grid-template-columns:1fr;}} </style>
</head>
<body>
<div class="page">
    <div class="topbar">
        <div class="brand">ECOSPHERE AI</div>
        <div class="nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/waste">Waste</a>
            <a href="/projects">Projects</a>
            <a href="/leaders">Leaderboard</a>
            <a href="/esg">ESG</a>
        </div>
    </div>

    <div class="content">
        <div class="card">
            <h2>Innovation Hub</h2>
            <table>
                <thead>
                    <tr><th>Project</th><th>Category</th><th>Status</th><th>Mentor</th></tr>
                </thead>
                <tbody id="projectRows"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Add Project</h2>
            <form id="projectForm">
                <input name="title" placeholder="Project Name" value="RC Car Challenge" />
                <input name="category" placeholder="Category" value="Mobility" />
                <input name="mentor" placeholder="Mentor" value="Mr. Kumar" />
                <input name="materialsUsed" placeholder="Materials Used" value="Recovered motor, battery, chassis" />
                <input name="recoveredComponents" placeholder="Recovered Components" value="Motor, Battery" />
                <select name="status">
                    <option>Idea</option>
                    <option>Approved</option>
                    <option>Developing</option>
                    <option>Prototype</option>
                    <option>Completed</option>
                </select>
                <textarea name="description" placeholder="Description" style="width:100%;min-height:120px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;margin-top:8px;">A re-engineered vehicle built using recovered components and circular design.</textarea>
                <button type="submit">Submit Project</button>
            </form>
        </div>
    </div>
</div>

<script>
    async function loadProjects() {
        const data = await fetch('/api/projects').then(r => r.json());
        document.getElementById('projectRows').innerHTML = (data || []).slice(0, 10).map(p => `
            <tr>
                <td>${p.title || 'Untitled'}</td>
                <td>${p.category || 'General'}</td>
                <td><span class="status-pill">${p.status || 'Idea'}</span></td>
                <td>${p.mentor || '-'}</td>
            </tr>
        `).join('');
    }

    document.getElementById('projectForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = new FormData(e.target);
        const payload = {
            title: form.get('title'),
            category: form.get('category'),
            mentor: form.get('mentor'),
            materialsUsed: form.get('materialsUsed'),
            recoveredComponents: form.get('recoveredComponents'),
            status: form.get('status'),
            description: form.get('description')
        };
        await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        loadProjects();
        e.target.reset();
    });

    loadProjects();
</script>
</body>
</html>
